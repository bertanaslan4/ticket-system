<!doctype html>
<html lang="tr">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b4e" />

    <!-- Tixia Theme CSS -->
    <link href="/assets/css/plugins.css" rel="stylesheet" />

      (function() {
        try {
          var t = localStorage.getItem('bekatos-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
        } catch(e){}
      })();
    </script>
