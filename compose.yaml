services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://tickets:${POSTGRES_PASSWORD}@db:5432/tickets
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      SEED_DEMO: "false"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
